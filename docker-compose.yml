services:
  mc-server:
    image: "${MC_IMAGE:-mc-server-watchdog:latest}"
    build:
      # Defaults to an adjacent repo dir, can be overridden via REPO_DIR in .env
      context: "${REPO_DIR:-../mc-server-autostart-watchdog}"
    restart: unless-stopped
    stop_grace_period: "60s"
    environment:
      - ROLE=server
    ports:
      - "${MC_PORT:-25565}:25565"
      - "${DYNMAP_PORT:-25566}:25566"
      - "${SSH_PORT:-2222}:2222"
    volumes:
      - "${MC_DATA_DIR:?Error: MC_DATA_DIR must be set}:/workspace/server:rw"
      - "${SECRETS_DIR:-./secrets}/mcserver.pem.pub:/root/.ssh/authorized_keys:ro"
    networks:
      - mc-net
    # runtime: krun
    # deploy:
    #   resources:
    #     limits:
    #       memory: 8G

  mc-backup:
    image: "${MC_IMAGE:-mc-server-watchdog:latest}"
    init: true
    restart: unless-stopped
    environment:
      - ROLE=backup
      - RESTIC_PASSWORD_FILE=/secrets/restic-password.txt
      - "RESTIC_REPOSITORY=${RESTIC_REPOSITORY:?Error: RESTIC_REPOSITORY must be set}"
    volumes:
      - "${MC_DATA_DIR}:/workspace/server:rw" # backup needs rw to server for .maintenance file
      - "${SECRETS_DIR:-./secrets/rclone}:/root/.config/rclone:rw" # rclone needs rw for config backups and potential refresh tokens
      - "${SECRETS_DIR:-./secrets}/restic-password.txt:/secrets/restic-password.txt:ro"
    networks:
      - mc-net

networks:
  mc-net:
